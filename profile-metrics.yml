name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily midnight UTC
  workflow_dispatch:       # manual run ke liye

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak Stats (tokyonight theme)
        uses: be-next/github-streak-stats-action@v1
        with:
          username: MAkmal01
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/streak-stats.svg
          theme: tokyonight

      - name: Generate Contribution Graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: profile/activity-graph.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Auto-update profile metrics" || echo "Nothing to commit"
          git push
